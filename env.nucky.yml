# Environment for the LAN deployment on `nucky` (192.168.2.25).
#
# This config makes newly-created Moodle test environments reachable via nice,
# port-less URLs (e.g. http://192.168.2.25/<infra>/<version>/) so the whole
# stack can be exposed through a single ngrok tunnel.
#
# It expects nginx to be the host webserver. The python app generates
# per-environment nginx snippets into `working_dir/.nginx/testenvs/`; those
# are included from `nucky_production_nginx.conf` deployed at
# /etc/nginx/sites-available/boost-union.
working_dir: "./example_pwd"
# proxied: yes makes _create_web_url append "/<infra>/<version>" so URLs are
# served by the front-end nginx via the per-moodle confs in testenvs/.
proxied: yes
nginx:
  # Hostname only — NO scheme prefix. The scheme is set separately via the
  # `scheme` key below and used to build Moodle's $CFG->wwwroot. Putting
  # "https://" in here ends up as "http://https//<host>/..." in redirects
  # (wwwroot is built as "http://" + base_url in moodle-docker upstream).
  base_url: "catachrestic-francoise-indomitably.ngrok-free.dev"
  # Which template under cross_cutting/templates/ to render as the outer
  # vhost. Defaults to the Plesk one when omitted.
  template: "nucky_production_nginx.conf"
  # No SSL on nucky itself (ngrok terminates TLS in front). Empty is fine
  # because the nucky template does not reference these.
  cert_chain_path: ""
  cert_key_path: ""
  # Scheme advertised in stored Moodle URLs. nucky itself serves plain HTTP;
  # if anyone fronts it with TLS (ngrok), they should override to "https".
  scheme: "https"
  # The React SPA is the overview page on nucky, so the legacy Jinja
  # `index.html` overview must NOT be written into the Apache/nginx docroot
  # (it would clobber the SPA). Point it at the working_dir so the file is
  # generated harmlessly out-of-band.
  overview_page_path: "/opt/boost-union-envs/backend/example_pwd/.nginx"
  # The React SPA serves as the overview page; its root is the Apache/nginx
  # docroot. Set above to a separate directory so the legacy Jinja overview
  # generator never overwrites the SPA shell.
  # On nucky we softlink working_dir/.nginx/testenvs here, then the outer
  # nginx vhost includes ${path}/*.conf to wire each Moodle into a /-prefixed
  # URL.
  softlinked_nginx_config_path: "/etc/nginx/conf.d/boost-union/testenvs"
