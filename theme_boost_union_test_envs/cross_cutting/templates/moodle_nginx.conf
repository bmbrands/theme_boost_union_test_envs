# Make sure REPLACE_LOCATION does not contain a leading slash
location /$REPLACE_LOCATION {
    # No trailing slash on proxy_pass: forward the original URI (including
    # the /$REPLACE_LOCATION/ prefix) untouched to the Moodle container.
    # This is required so Moodle's $CFG->wwwroot path matches the request
    # path. With a trailing slash, nginx strips the prefix and Moodle
    # detects a wwwroot mismatch (lib/setuplib.php) and 303-redirects to
    # the bare host, which falls through to the SPA.
    # Inside the container MOODLE_DOCKER_WEB_HOST must include the path
    # prefix and MOODLE_DOCKER_WEB_PORT must be empty so wwwroot is built
    # without the host port (which is bound to the reverse proxy only).
    proxy_pass http://127.0.0.1:$REPLACE_PORT;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1000s;
    proxy_redirect default;
}
