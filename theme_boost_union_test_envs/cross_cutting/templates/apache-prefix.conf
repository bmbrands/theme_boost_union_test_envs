# Mounted into the Moodle webserver container at
# /etc/apache2/conf-enabled/moodle-prefix.conf when this environment is
# served behind a path-based reverse proxy.
#
# The outer nginx forwards the original URI (including the /<env>/<version>
# prefix) to Apache. Without an Alias, Apache would 404 because its
# DocumentRoot is at the bare web root. The Alias maps the prefixed path
# back to the same docroot, so static files and PHP scripts resolve
# correctly while Moodle's $CFG->wwwroot path check (lib/setuplib.php)
# still passes — keeping all generated URLs prefixed.
Alias /$REPLACE_LOCATION $REPLACE_DOCROOT
<Directory $REPLACE_DOCROOT>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
