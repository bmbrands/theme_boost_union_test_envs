version: "2"
services:
  webserver:
    volumes:
      - "$REPLACE_PLUGIN_SOURCE_PATH:/var/www/html/$REPLACE_WEBROOT_PREFIX$REPLACE_PLUGIN_INSTALL_DIR:cached"
$REPLACE_PROXY_OVERRIDES
  # Dedicated sidecar that runs Moodle's cron every 5 minutes. The base image
  # has PHP but no cron daemon, and Apache runs in the foreground in the
  # webserver container, so a separate container running a simple loop is the
  # most robust way to keep scheduled tasks ticking (and it survives restarts).
  # It mounts the same Moodle source + plugin overlay and reuses the same DB
  # connection as the webserver. MOODLE_DOCKER_DB is always present in .env and
  # equals the DB type, so DBTYPE is derived from it generically.
  cron:
    image: "moodlehq/moodle-php-apache:${MOODLE_DOCKER_PHP_VERSION}"
    depends_on:
      - db
    volumes:
      - "${MOODLE_DOCKER_WWWROOT}:/var/www/html"
      - "$REPLACE_PLUGIN_SOURCE_PATH:/var/www/html/$REPLACE_WEBROOT_PREFIX$REPLACE_PLUGIN_INSTALL_DIR:cached"
    environment:
      MOODLE_DOCKER_RUNNING: 1
      MOODLE_DOCKER_DBTYPE: "${MOODLE_DOCKER_DB}"
      MOODLE_DOCKER_DBHOST: db
      MOODLE_DOCKER_DBNAME: moodle
      MOODLE_DOCKER_DBUSER: moodle
      MOODLE_DOCKER_DBPASS: "m@0dl3ing"
      MOODLE_DOCKER_WEB_HOST: "${MOODLE_DOCKER_WEB_HOST}"
    entrypoint: ["bash", "-c", "while true; do php /var/www/html/admin/cli/cron.php || true; sleep 300; done"]
