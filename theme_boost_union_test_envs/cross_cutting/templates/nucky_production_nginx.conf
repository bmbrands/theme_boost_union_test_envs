# nginx vhost for the `nucky` LAN deployment (192.168.2.25).
#
# Single-port frontend so the whole stack can be exposed through one ngrok
# tunnel. Layout:
#   /                 -> React SPA (Vite build dist) — overview page
#   /api/             -> FastAPI backend (uvicorn @ 127.0.0.1:8000)
#   /docs             -> FastAPI Swagger UI
#   /openapi.json     -> FastAPI OpenAPI schema
#   /<infra>/<ver>/   -> per-Moodle reverse proxies (auto-included from
#                        testenvs/ — generated by TemplateEngine.moodle_nginx_config)
#
# Substitution variables (filled in by TemplateEngine.overview_nginx_config):
#   $REPLACE_BASE_URL              host name (e.g. 192.168.2.25)
#   $REPLACE_WWW_ROOT              SPA docroot (e.g. /var/www/html)
#   $REPLACE_PROXY_LOG_PATH        directory for access/error logs
#   $REPLACE_SOFTLINKED_SUBDIRECTORY  path containing per-moodle *.conf files
#
# Notes:
# - No SSL: ngrok / a reverse proxy in front handles TLS termination.
# - Body size raised to 128M for plugin uploads.
# - Static assets get long Cache-Control; the SPA shell is no-cache so
#   deploys are picked up immediately.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name $REPLACE_BASE_URL _;

    client_max_body_size 134217728;

    access_log "$REPLACE_PROXY_LOG_PATH/boost_union_access_log";
    error_log  "$REPLACE_PROXY_LOG_PATH/boost_union_error_log";

    root "$REPLACE_WWW_ROOT";
    index index.html;

    # --- FastAPI backend --------------------------------------------------
    # Pass through to uvicorn. Trailing slash on proxy_pass keeps the path
    # intact (e.g. /api/foo -> /api/foo on the backend; FastAPI mounts its
    # routes at /api).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host             $http_host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host             $http_host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Per-Moodle reverse proxies --------------------------------------
    # Each entry of the form
    #     location /<infra>/<version> {
    #         proxy_pass http://127.0.0.1:<container_port>/;
    #     }
    # is generated by TemplateEngine.moodle_nginx_config() into
    # working_dir/.nginx/testenvs/<infra>-<version>.conf and pulled in here.
    include "$REPLACE_SOFTLINKED_SUBDIRECTORY/*.conf";

    # --- React SPA --------------------------------------------------------
    # Long-cache the hashed Vite assets…
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # …but never cache the shell so new deploys land instantly.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback: anything that isn't an existing file/folder and didn't
    # match an /api/, /docs, /openapi.json or per-moodle location goes to the
    # SPA so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
